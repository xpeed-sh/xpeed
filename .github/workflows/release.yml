name: Publish Xpeed release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version"
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows compiler and SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\scripts\package-installer.ps1

      - name: Create checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = "dist/installer/Xpeed-Setup-$version-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash *Xpeed-Setup-$version-x64.exe" | Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/Xpeed-Setup-*-x64.exe
            dist/installer/SHA256SUMS.txt
